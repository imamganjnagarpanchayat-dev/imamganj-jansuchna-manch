<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Panel | जन सूचना मंच</title>
<style>
body{font-family:Arial,"Noto Sans Devanagari",sans-serif;background:#f3f6fa;margin:0;color:#172033}
header{background:#071f49;color:#fff;padding:18px;text-align:center}
.container{width:92%;max-width:1100px;margin:25px auto}
.login,.card{background:#fff;padding:22px;border-radius:10px;box-shadow:0 2px 10px #0001;margin-bottom:18px}
input{width:100%;padding:12px;border:1px solid #ccd3df;border-radius:6px;box-sizing:border-box;margin:7px 0}
button,a{border:0;background:#d71920;color:#fff;padding:11px 16px;border-radius:6px;font-weight:bold;text-decoration:none;display:inline-block;margin-top:10px;cursor:pointer}
button:disabled{opacity:.6}
.back{background:#0756b8}
.logout{background:#555}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:#fff;padding:20px;border-radius:8px;text-align:center;box-shadow:0 2px 8px #0001}
.stat b{display:block;font-size:28px;color:#0756b8}
.news-card{border:1px solid #ddd;border-radius:8px;padding:16px;margin:12px 0;background:#fafafa}
.status{display:inline-block;padding:5px 9px;border-radius:5px;background:#ffe08a;margin-bottom:10px}
.success{background:#e7f7e7;padding:12px;border-radius:7px;margin:10px 0}
.error{background:#ffe8e8;padding:12px;border-radius:7px;margin:10px 0}
.hidden{display:none}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<header>
<h1>🔐 Admin Panel</h1>
<p>नगर पंचायत इमामगंज — जन सूचना मंच</p>
</header>

<main class="container">

<div class="login">
<h2>Admin Login</h2>
<p>Supabase सुरक्षित authentication</p>

<input id="email" type="email" placeholder="Admin Email" value="" autocomplete="off">
<input id="password" type="password" placeholder="Password">

<button id="adminLoginBtn" onclick="login()">Login</button>
<button class="logout hidden" id="logoutBtn" onclick="logout()">Logout</button>
<a class="back" href="../index.html">होम</a>

<div id="loginMessage"></div>
</div>

<div id="dashboard" class="hidden">

<h2>📊 Dashboard</h2>

<section class="stats">
<div class="stat"><b id="totalCount">0</b>कुल खबरें</div>
<div class="stat"><b id="pendingCount">0</b>Pending</div>
<div class="stat"><b id="publishedCount">0</b>Published</div>
<div class="stat"><b id="reporterCount">0</b>Reporters</div>
</section>

<div class="card">
<h2>📰 News Management</h2>
<div id="newsMessage"></div>
<div id="newsList"></div>
</div>

<div class="card">
<h2>👨‍💼 Reporter Management</h2>
<p>Reporter accounts का management यहाँ होगा।</p>
<strong>Reporters: <span id="reporterCount2">0</span></strong>
</div>

</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL="https://khuuuoaomxgabrxxbcgt.supabase.co";
const SUPABASE_KEY="sb_publishable_NPbWb9gzgTQAr4xHezXt2w_3OajT3xk";

const ADMIN_EMAIL="imamganjnagarpanchayat@gmail.com";

const client=window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:false,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);

const loginMessage=document.getElementById("loginMessage");
const dashboard=document.getElementById("dashboard");
const newsList=document.getElementById("newsList");
const newsMessage=document.getElementById("newsMessage");

function showLoginMessage(text,type="success"){
loginMessage.innerHTML="<div class='"+type+"'>"+text+"</div>";
}

function showNewsMessage(text,type="success"){
newsMessage.innerHTML="<div class='"+type+"'>"+text+"</div>";
}

async function login(){

const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;
const button=document.getElementById("adminLoginBtn");

if(!email||!password){
showLoginMessage("❌ Email और Password डालें","error");
return;
}

button.disabled=true;
button.textContent="Login हो रहा है...";

try{

const {data,error}=await client.auth.signInWithPassword({
email:email,
password:password
});

if(error){
showLoginMessage("❌ Login failed: "+error.message,"error");
return;
}

if(!data.session){
showLoginMessage("❌ Session नहीं बना।","error");
return;
}

const loggedInEmail=(data.user?.email||"").toLowerCase();

if(loggedInEmail !== ADMIN_EMAIL.toLowerCase()){
  await client.auth.signOut();
  dashboard.classList.add("hidden");
  document.getElementById("logoutBtn").classList.add("hidden");
  showLoginMessage("❌ यह Account Admin नहीं है। केवल अधिकृत Admin ही Login कर सकता है।","error");
  return;
}

showLoginMessage("✅ Admin Login सफल हुआ!");

document.getElementById("logoutBtn").classList.remove("hidden");
dashboard.classList.remove("hidden");

await loadDashboard();

}catch(err){

showLoginMessage("❌ Error: "+(err.message||err),"error");

}finally{

button.disabled=false;
button.textContent="Login";

}
}

async function loadDashboard(){

showNewsMessage("⏳ खबरें लोड हो रही हैं...");

const {data,error}=await client
.from("news")
.select("*")
.order("created_at",{ascending:false});

if(error){
showNewsMessage("❌ News load error: "+error.message,"error");
return;
}

const news=data||[];

const pending=news.filter(n=>n.status==="pending");
const published=news.filter(n=>n.status==="published");

document.getElementById("totalCount").textContent=news.length;
document.getElementById("pendingCount").textContent=pending.length;
document.getElementById("publishedCount").textContent=published.length;

document.getElementById("reporterCount").textContent=0;
document.getElementById("reporterCount2").textContent=0;

if(news.length===0){
newsList.innerHTML="<div class='success'>✅ अभी कोई खबर नहीं है।</div>";
newsMessage.innerHTML="";
return;
}

newsList.innerHTML=news.map(n=>{

let statusText="⏳ Pending";
let statusStyle="background:#fff3cd;color:#856404;";

if(n.status==="published"){
statusText="✅ Published";
statusStyle="background:#d4edda;color:#155724;";
}

if(n.status==="rejected"){
statusText="❌ Rejected";
statusStyle="background:#f8d7da;color:#721c24;";
}

return `

<div class="news-card">

<span class="status" style="${statusStyle}">${statusText}</span>

<h3>${escapeHtml(n.title||"बिना शीर्षक")}</h3>

<p>${escapeHtml(n.content||"")}</p>

<p><strong>👤 Reporter:</strong> ${escapeHtml(n.reporter_name||"—")}</p>

<p><strong>📞 Phone:</strong> ${escapeHtml(n.reporter_phone||"—")}</p>

<p><strong>📍 Location:</strong> ${escapeHtml(n.location||"—")}</p>

${n.image_url ? `
<div style="margin:12px 0;">
  <p><strong>🖼️ फोटो:</strong></p>
  <img src="${escapeHtml(n.image_url)}"
       alt="News Image"
       style="width:100%;max-width:500px;max-height:300px;object-fit:contain;border-radius:10px;border:1px solid #ddd;">
</div>
` : ""}

${n.video_url ? `
<div style="margin:12px 0;">
  <p><strong>🎥 वीडियो:</strong></p>
  <video controls playsinline preload="metadata"
         style="width:100%;max-width:600px;max-height:350px;border-radius:10px;background:#000;">
    <source src="${escapeHtml(n.video_url)}" type="video/mp4">
    आपका ब्राउज़र वीडियो प्ले नहीं कर सकता।
  </video>
</div>
` : ""}

<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">

${n.status==="pending" ? `
<button
onclick="updateNews(${n.id},'published')"
style="flex:1;min-width:110px;">
✅ Publish
</button>

<button
onclick="updateNews(${n.id},'rejected')"
style="flex:1;min-width:110px;">
❌ Reject
</button>
` : ""}

<button
onclick="deleteNews(${n.id})"
style="flex:1;min-width:110px;background:#dc3545;color:#fff;border:0;border-radius:6px;padding:10px;font-weight:700;">
🗑️ Delete
</button>

</div>

</div>

`;
}).join("");

newsMessage.innerHTML="";
}


async function updateNews(id,status){

const action=status==="published"?"Publish":"Reject";

if(!confirm("क्या आप इस खबर को "+action+" करना चाहते हैं?")) return;

const {error}=await client
.from("news")
.update({status:status})
.eq("id",id);

if(error){
showNewsMessage("❌ "+action+" failed: "+error.message,"error");
return;
}

showNewsMessage(
status==="published"
?"✅ खबर Publish हो गई!"
:"❌ खबर Reject हो गई!"
);

await loadDashboard();
}


function getStoragePathFromUrl(url){

if(!url) return null;

const marker="/storage/v1/object/public/news-media/";

const index=url.indexOf(marker);

if(index===-1) return null;

return decodeURIComponent(
url.substring(index + marker.length)
);

}


async function deleteNews(id){

const confirmed=confirm(
"⚠️ क्या आप इस खबर को हमेशा के लिए Delete करना चाहते हैं?\n\n"+
"खबर के साथ उसका फोटो/वीडियो भी हटाया जाएगा।\n\n"+
"यह कार्रवाई वापस नहीं की जा सकती।"
);

if(!confirmed) return;

showNewsMessage("⏳ खबर और Media Delete हो रहा है...");

const {data,error:fetchError}=await client
.from("news")
.select("id,title,image_url,video_url")
.eq("id",id)
.single();

if(fetchError){
showNewsMessage("❌ खबर नहीं मिली: "+fetchError.message,"error");
return;
}


const mediaPaths=[];

const imagePath=getStoragePathFromUrl(data.image_url);
const videoPath=getStoragePathFromUrl(data.video_url);

if(imagePath) mediaPaths.push(imagePath);
if(videoPath) mediaPaths.push(videoPath);


if(mediaPaths.length>0){

const {error:storageError}=await client
.storage
.from("news-media")
.remove(mediaPaths);

if(storageError){

showNewsMessage(
"❌ Media Delete नहीं हो सका: "+storageError.message,
"error"
);

return;
}

}


const {error:deleteError}=await client
.from("news")
.delete()
.eq("id",id);

if(deleteError){

showNewsMessage(
"❌ खबर Delete नहीं हुई: "+deleteError.message,
"error"
);

return;
}

showNewsMessage("✅ खबर और उसका Media सफलतापूर्वक Delete हो गया!");

await loadDashboard();

}


async function logout(){

await client.auth.signOut();

dashboard.classList.add("hidden");
document.getElementById("logoutBtn").classList.add("hidden");

showLoginMessage("आप Logout हो गए हैं।");
}

function escapeHtml(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

async function checkSession(){

dashboard.classList.add("hidden");
document.getElementById("logoutBtn").classList.add("hidden");

const {data}=await client.auth.getSession();

if(!data || !data.session){
  return;
}

const loggedInEmail=(data.session.user?.email||"").toLowerCase();

if(loggedInEmail !== ADMIN_EMAIL.toLowerCase()){
  await client.auth.signOut();
  return;
}

dashboard.classList.remove("hidden");
document.getElementById("logoutBtn").classList.remove("hidden");

await loadDashboard();

}

checkSession();
</script>

</body>
</html>
