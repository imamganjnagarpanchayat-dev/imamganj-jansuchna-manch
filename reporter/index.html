<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reporter Panel | जन सूचना मंच</title>
<style>
body{font-family:Arial,"Noto Sans Devanagari",sans-serif;background:#f3f6fa;margin:0;color:#172033}
header{background:#071f49;color:#fff;padding:18px;text-align:center}
.container{width:92%;max-width:850px;margin:25px auto}
.card{background:#fff;padding:22px;border-radius:10px;box-shadow:0 2px 10px #0001;margin-bottom:18px}
h1,h2{color:#071f49}label{display:block;font-weight:bold;margin:12px 0 6px}
input,textarea,select{width:100%;padding:12px;border:1px solid #ccd3df;border-radius:6px;font-size:15px;box-sizing:border-box}
button,a.btn{border:0;background:#d71920;color:#fff;padding:12px 18px;border-radius:6px;font-weight:bold;display:inline-block;text-decoration:none;margin-top:15px}
.back{background:#0756b8!important}
.note{background:#fff3cd;padding:12px;border-radius:6px}
</style>
</head>
<body>
<header><h1 style="color:#fff">👨‍💼 Reporter Panel</h1><p>नगर पंचायत इमामगंज — जन सूचना मंच</p></header>
<main class="container">
<div class="card">
<h2>Reporter Login</h2>
<p class="note">अभी यह interface है। Supabase जोड़ने के बाद यहाँ असली Login/Registration काम करेगा।</p>
<label>Email</label><input type="email" placeholder="Reporter Email">
<label>Password</label><input type="password" placeholder="Password">
<button onclick="alert('Supabase connect होने के बाद Login सक्रिय होगा।')">Login</button>
<a class="btn back" href="../index.html">होम पर जाएँ</a>
</div>

<div class="card">
<h2>📰 नई खबर भेजें</h2>
<label>खबर की Headline</label><input placeholder="खबर की मुख्य हेडलाइन">
<label>Category</label>
<select><option>इमामगंज</option><option>जन समस्या</option><option>बिहार</option><option>सरकारी सूचना</option><option>अन्य</option></select>
<label>स्थान</label><input placeholder="गाँव / पंचायत / वार्ड">
<label>खबर का विवरण</label><textarea rows="7" placeholder="पूरी खबर लिखें..."></textarea>
<label>फोटो</label><input type="file" accept="image/*">
<label>वीडियो</label><input type="file" accept="video/*">
<button onclick="alert('Supabase जोड़ने के बाद खबर database में जाएगी और Admin approval के लिए Pending होगी।')">खबर Submit करें</button>
</div>
</main>
</body>
</html>
